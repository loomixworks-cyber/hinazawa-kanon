name: Optimize site assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize-assets.sh'
      - '.github/workflows/optimize-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Optimize assets
        run: bash scripts/optimize-assets.sh

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css assets/images
          if git diff --cached --quiet; then
            echo "No optimization changes to commit."
            exit 0
          fi
          git commit -m "Optimize site images for mobile bandwidth [skip ci]"
          git push
