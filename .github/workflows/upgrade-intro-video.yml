name: Upgrade intro video quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-intro-video.yml'
      - 'scripts/upgrade-intro-quality.sh'

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build high-quality scrub videos
        run: bash scripts/upgrade-intro-quality.sh

      - name: Commit upgraded videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video/kanon-intro-mobile-scrub.mp4
          git add assets/video/kanon-intro-desktop-scrub.mp4
          git add dist/assets/video/kanon-intro-mobile-scrub.mp4
          git add dist/assets/video/kanon-intro-desktop-scrub.mp4
          git commit -m "Upgrade intro scrub video quality" || exit 0
          git push
